[package]
name = "git-terminal"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Native GPUI Fast terminal for git-next"
repository = "https://github.com/neko233-com/git-terminal"
[dependencies]
anyhow = "1"
flume = "0.12"
clap = { version = "4.6", features = ["derive"] }
gpui = { package = "gpui-fast", version = "=0.1.10", default-features = false, features = ["font-kit", "windows-manifest"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.10" }
gpui-terminal = { path = "vendor/gpui-terminal" }
portable-pty = "0.9"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Authentication_Identity", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
[dev-dependencies]
alacritty_terminal = "=0.25.1"
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = [".", "vendor/gpui-terminal", "vendor/gpui-fast-windows"]
exclude = ["vendor/portable-pty"]

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
# gpui-fast 0.1.10 only reports resize hit-test codes for the top border and removes the
# non-client resize frame on the other three edges, so a borderless window cannot be resized
# by dragging. See vendor/gpui-fast-windows/MODIFICATIONS.md.
gpui-fast-windows = { path = "vendor/gpui-fast-windows" }
